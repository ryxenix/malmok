# TUI 문자열 카탈로그. 진단 코드(PF-204 등)는 식별자라 여기 없다.
app:
  title: platformctl 설치
step:
  lang: 언어
  nodes: 노드
  profile: 프로파일
  options: 옵션
  network: 네트워크
  registry: 레지스트리
  pki: 인증서
  preflight: 사전 검사
  summary: 요약
  install: 설치
  done: 완료
lang:
  heading: 언어 선택
  help: 이 설치기의 언어를 고르십시오. 로그 출력은 항상 영어이며 바뀌지 않습니다.
nodes:
  heading: 노드 정보
  help: "설치할 노드를 입력하십시오. agent 는 쉼표로 구분합니다."
  server: server IP
  agents: agent IP
  user: SSH 사용자
  port: SSH 포트
  registration: 조인 주소
  version: RKE2 버전
  domain: 도메인
profile:
  heading: 프로파일 선택
  help: 설치 환경을 고르십시오. 프로파일이 검증된 기준값을 정하고, 나머지 설정은 모두 그 위의 덮어쓰기입니다.
  homelab: 단일 노드 · 온라인 · local-path
  company: 1+2 · 온라인 · longhorn
  dmz: 1+2 · 프록시 · 사설 CA
  airgap_ubuntu: 1+2 · 폐쇄망 · 사설 CA
  airgap_rocky: Rocky 9 · 폐쇄망 · 사설 CA
  airgap_cons: Rocky 9 · 폐쇄망 · canal 폴백
options:
  heading: 플랫폼 옵션
  help: dataplane 은 CNI · 게이트웨이 · LB IP 공급원을 하나로 묶은 선택입니다. 셋은 독립적이지 않습니다.
  dataplane: dataplane
  storage: 스토리지
dp:
  cilium_gw: Cilium CNI · Cilium 게이트웨이 · LB-IPAM
  cilium_traefik: Cilium CNI · Traefik 게이트웨이
  canal: Canal · Traefik · eBPF 불필요
st:
  local: 단일 노드 전용
  longhorn: 복제본 · iscsid 필요
  nfs: 외부 서버
  server: NFS 서버
  path: 내보내기 경로
preflight:
  heading: 사전 검사
summary:
  heading: 설치 요약
  help: 변경 전 마지막 확인입니다. 아직 어떤 노드에도 쓰지 않았습니다.
  warnings: 사전 검사 지적사항
  valid: 문서가 유효합니다
  invalid: 문서에 문제가 있습니다
install:
  heading: 설치 진행
done:
  heading: 완료
  ok: 설치가 끝났습니다
  failed: 설치가 중단되었습니다
  artifacts: run 디렉터리
  resume: 원인을 고친 뒤 같은 run id 로 이어서 실행하십시오. 끝난 단계는 다시 돌지 않습니다.
status:
  pending: 대기
  running: 진행중
  ok: 완료
  skipped: 건너뜀
  failed: 실패
  blocked: 차단
btn:
  next: 계속
  back: 뒤로
  quit: 종료
  abort: 중단
  check: 다시 검사
  install: 설치 시작
  fix: 고치러 가기
  logs: 로그
  close: 닫기
key:
  retry: 재시도
hint:
  registration: VIP 또는 DNS 이름. 노드 자신의 주소는 안 됩니다 (ADR-008)
  lbpool: 게이트웨이가 외부 주소를 받아갈 CIDR
  noproxy: pod·service CIDR 을 넣지 않으면 클러스터 내부 통신이 프록시를 탑니다
  registry: 모든 시스템 이미지를 여기서 받습니다
  sourceref: file:// · env:// · sops:// — 값이 아니라 참조
  rootkey: intermediate 키입니다. root 키는 오프라인에 둡니다
  select: 위아래로 이동, Enter 로 선택, Tab 으로 버튼 이동
  edit: Enter 로 편집, Tab 으로 버튼 이동
  editing: 입력 중. Enter 또는 Esc 로 마침
  install: 계속하면 노드에 실제로 씁니다
  fix: 설치 전에 문제를 먼저 고치십시오
  working: 진행 중
  finished: 끝났습니다
  close: Enter 로 닫기
note:
  profile: 프로파일이 검증된 기준값을 정합니다. 옵션 화면에 무엇이 선택됐는지 표시됩니다.
  options: 프로파일을 덮어씁니다. CNI·게이트웨이·LB IP 는 하나의 원자적 선택입니다 (ADR-004).
net:
  heading: 네트워크
  help: 고객사 네트워크팀과 합의해야 하는 주소들입니다. LB 주소 풀은 게이트웨이가 외부 주소를 받아가는 대역입니다.
  proxyHTTP: HTTP 프록시
  proxyHTTPS: HTTPS 프록시
  noProxy: 프록시 제외
  lbpool: LB 주소 풀
reg:
  heading: 레지스트리
  help: 이미지를 받아올 곳입니다. 자격증명은 값이 아니라 참조로 적습니다.
  host: 레지스트리 주소
  user: 사용자 참조
  pass: 비밀번호 참조
  ca: CA 인증서 참조
pki:
  heading: 인증서
  help_ca: 클러스터 내부 인증서를 발급할 사설 CA 입니다.
  help_acme: 공인 인증서를 발급받을 ACME 계정입니다.
  note_rootkey: 오프라인 root 의 개인키는 묻지 않으며 입력란도 없습니다. 공개 root 만 참조합니다.
  root: root 인증서 참조
  inter: intermediate 참조
  key: intermediate 키 참조
  email: 계정 이메일
  provider: DNS 공급자
  token: API 토큰 참조
