name: docs

# Published on every push to main that changes what the site is built from,
# and by hand. It was manual-only while the repository was private; once it
# went public that left malmok.dev behind the repository -- telling readers
# three-server HA was unverified after it had been verified, and showing an
# install example for a release that no longer exists.
#
# The paths are everything the built site is made of: the pages, the site
# configuration, the theme override that prints the version banner, and the
# hook that works the version out.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - overrides/**
      - scripts/docs_version.py
      - mkdocs.yml
      - requirements-docs.txt
      - .github/workflows/docs.yml
  # A release changes what the banner should say without changing any file the
  # paths above name, so no push trigger can catch it. The version is read from
  # the tags present when the site is built, and a tag pushed after that build
  # leaves the site describing the release before it: v0.96.5 shipped and
  # malmok.dev went on saying "v0.96.4 plus 6 unreleased changes".
  #
  # The release workflow therefore starts this one by hand once the release is
  # published. A `release: published` trigger was tried first and never fired:
  # the release is created with the workflow's own token, and GitHub does not
  # start workflows from events that token causes -- manual dispatch is the
  # exception. v0.96.6 had a correct banner only because the tag happened to
  # reach GitHub before this workflow's push-triggered build read the tags.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags: the site says which release it
      # describes, and a shallow checkout has no tags to read that from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # The cache key comes from the dependency file, and the default
          # patterns are requirements.txt and pyproject.toml -- neither of
          # which this repository has. Without naming ours the step fails
          # outright rather than skipping the cache.
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

