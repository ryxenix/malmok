# TUI string catalogue. English is the default (ADR-009).
# Codes such as PF-204 are identifiers, never translated, and never appear here.
header:
  running: installing
  done: complete
  failed: halted
  cancelled: cancelled
column:
  phase: PHASE
  status: STATUS
status:
  pending: waiting
  running: running
  ok: done
  skipped: skipped
  failed: failed
  blocked: blocked
section:
  log: LOG
  failures: FAILURES
  nothing: waiting for the first event
key:
  detach: detach
  quit_observer: quit (engine keeps running)
  quit_owner: abort the run
  logs: all logs
  language: 한국어
  ascii: ascii
  retry: retry
hint:
  narrow: terminal is narrower than 80 columns; some columns are truncated
  detached: "detached. reattach with platformctl attach"
