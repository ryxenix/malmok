name: docs

# Publishing remains manual while the repository and documentation are private.
# Add a push trigger only when the project is explicitly approved for release.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # The whole history and its tags: the site says which release it
      # describes, and a shallow checkout has no tags to read that from.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # The cache key comes from the dependency file, and the default
          # patterns are requirements.txt and pyproject.toml -- neither of
          # which this repository has. Without naming ours the step fails
          # outright rather than skipping the cache.
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

