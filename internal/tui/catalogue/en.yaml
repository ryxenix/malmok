# TUI string catalogue. English is the default (ADR-009).
# Diagnostic codes such as PF-204 are identifiers and never appear here.
app:
  title: platformctl
step:
  nodes: Nodes
  profile: Profile
  where: Where
  prefs: Settings
  options: Options
  network: Network
  registry: Registry
  pki: Certificates
  preflight: Checks
  summary: Summary
  install: Install
  done: Finished
  open: Document
  save: Save
  target: Version
  upgrade: Upgrade
prefs:
  heading: Settings
  help: "How this screen looks. Space changes the one under the cursor and the choice is kept for next time; g, a and s are the same three toggles from any screen."
  lang: Language
  charset: Character set
  charset.unicode: Unicode
  charset.ascii: ASCII
  rail: Step list
  rail.shown: shown
  rail.hidden: hidden
  where: Kept in
menu:
  heading: Start
  help: "What would you like to do?"
  install: Install a cluster
  install.help: Build a new RKE2 cluster from scratch, or re-run against one this tool already built.
  upgrade: Upgrade
  upgrade.help: Move a cluster to a newer version, one node at a time.
  document: Edit a document
  document.help: Open an existing cluster.yaml and change it without starting a build.
  settings: Settings
  settings.help: Language, character set and the step list. Kept between runs.
  logs: Runs and logs
  logs.help: Look at what a previous run did, including one that failed.
  quit: Quit
  quit.help: Close platformctl. Nothing running on a node is stopped.
  unavailable: "  (not built yet)"
  unavailable.status: This is not implemented. Nothing here will change if you choose it.
open:
  heading: Open a document
  help: "Choose the cluster.yaml to edit. It is read as it is, edited on the screens that follow, and written back — fields this wizard has no screen for are kept untouched."
  help.upgrade: "Choose the cluster.yaml that names the cluster to upgrade. It is read, not written: the file describes what the cluster is, and it becomes true when the last node reports the new version."
  path: Path
  path.hint: A path to a cluster.yaml. Choosing one below fills this in.
  found: "Found here"
  none: No document was found in this directory. Type a path above.
  hint: Space chooses one of the files below; Enter edits the path
  err.empty: No path was given, so there is nothing to open.
save:
  heading: Save
  help: "This is what will be written. Everything the screens do not show is carried over from the document as it was read."
  path: Written to
  written: The document has been written.
  after: "Nothing on a cluster has changed. Run `platformctl apply -f` against this file to make it so."
  hint: Enter writes the file; Esc goes back to change something
target:
  heading: Target version
  help: "Choose the version to move to. Nothing is touched until the preconditions pass: the control plane moves one minor version at a time, there is no downgrade, and every node has to be Ready before the first one goes down."
  document: Document
  from: Running now
  unknown: not recorded in the document
  version: Move to
  version.hint: "An RKE2 version, e.g. v1.35.7+rke2r1"
  note: "Servers first, then agents, one node at a time. Each node is drained before its kubelet restarts and uncordoned once the cluster agrees it is back."
upgrade:
  heading: Upgrading
doc:
  snapshot: "  (a run's snapshot — editing it means that run can no longer be resumed)"
runs:
  heading: Runs
  help: "Every run this tool recorded, newest first. Opening one replays what happened."
  none: No run has been recorded here yet. A run appears once `platformctl apply` has written one.
  count: run(s)
where:
  heading: Where to build
  help: "Which machine is this cluster being built on? The first server can be this machine, in which case nothing is connected to and its address is taken from the machine itself."
  here: This machine
  remote: Other machines
  remote.note: entered by address, reached over SSH
  noaddress: This machine has no routable IPv4 address, so there is nothing for the cluster to advertise
nodes:
  heading: Node details
  help: "Enter the nodes to install on. Separate agents with commas."
  help.local: "Enter the nodes to install on. Every address here belongs to this machine, so the work runs here and nothing is connected to."
  server: Server IP
  thismachine: This machine
  advertised: the address the rest of the cluster reaches
  agents: Agent IPs
  user: SSH user
  port: SSH port
  password: SSH password
  sudopassword: sudo password
  registration: Join address
  version: RKE2 version
  domain: Domain
profile:
  heading: Profile
  help: Pick the environment. The profile decides the validated baseline; every other setting is an override.
  homelab: single node, online, local-path
  company: 1+2, online, longhorn
  dmz: 1+2, proxy, private CA
  airgap_ubuntu: 1+2, air-gapped, private CA
  airgap_rocky: Rocky 9, air-gapped, private CA
  airgap_cons: Rocky 9, air-gapped, canal fallback
options:
  heading: Platform options
  help: The dataplane binds CNI, gateway and load balancer IP as one choice; they are not independent.
  dataplane: Dataplane
  storage: Storage
dp:
  cilium_gw: Cilium CNI and gateway, LB-IPAM
  cilium_traefik: Cilium CNI, Traefik gateway
  canal: Canal and Traefik, no eBPF required
st:
  local: single node only
  longhorn: replicated, needs iscsid
  nfs: external server
  server: NFS server
  path: Export path
progress:
  stopped: It stopped before anything ran
preflight:
  heading: Preflight checks
summary:
  heading: Summary
  help: Review before anything is changed. Nothing has been written to a node yet.
  warnings: findings from preflight
  valid: The document is valid
  invalid: The document has problems
install:
  heading: Installing
done:
  heading: Finished
  ok: Installation complete
  failed: Installation stopped
  upgraded: The cluster is on the new version
  upgrade_failed: The upgrade stopped
  cluster: What was built
  artifacts: Where it went
  rundir: Run directory
  nodes: Nodes
  elapsed: Elapsed
  pki_none: none, add certificates later
  problems: What failed
  next: Reattach to this run with
  resume: Fix the cause and resume with the same run id. Completed steps are not repeated.
status:
  pending: waiting
  running: running
  ok: done
  skipped: skipped
  failed: failed
  blocked: blocked
btn:
  next: Continue
  done: Done
  open: Open
  back: Back
  quit: Quit
  abort: Abort
  check: Retry checks
  install: Install
  fix: Go and fix
  logs: Logs
  close: Close
  load: Load
  save: Save
  upgrade: Start the upgrade
key:
  retry: retry
hint:
  password: Used for the checks only; it is never written to cluster.yaml. Leave empty to use a key or an agent
  registration: A VIP or DNS name, never a node's own address (ADR-008)
  lbpool: CIDRs the gateway takes its external address from
  noproxy: Include the pod and service CIDRs, or in-cluster traffic goes through the proxy
  registry: Every system image is pulled from here
  sourceref: file://, env:// or sops:// -- a reference, not the value
  rootkey: This is the intermediate key. The root key stays offline
  sudopassword: Only used to elevate on this machine; never written to cluster.yaml. Leave empty if platformctl is already running as root
  toggle_steps: steps
  toggle_ascii: ascii
  toggle_lang: 한국어
  select: Up and down to move, Space to choose, Enter to continue
  edit: Up and down to move, Enter to edit, Tab for the buttons
  editing: Typing. Enter or Esc to finish
  install: Continue writes to the nodes
  fix: Fix the problems before installing
  working: Working
  finished: Finished
  close: Enter to close
note:
  profile: The profile fixes the validated baseline; the options screen shows what it chose.
  options: Overrides the profile. CNI, gateway and load balancer IP are one atomic choice (ADR-004).
net:
  heading: Network
  help: Addressing the customer's network team has to agree to. The load balancer pool is what the gateway takes its external address from.
  proxyHTTP: HTTP proxy
  proxyHTTPS: HTTPS proxy
  noProxy: No proxy
  lbpool: LB address pool
reg:
  heading: Registry
  help: Where images are pulled from.
  note_none: Nothing to configure. Images come from here without a registry to stand up or keep alive.
  host: Registry host
  user: Username ref
  pass: Password ref
  ca: CA certificate ref
pki:
  heading: Certificates
  help_mode: Whether to issue certificates now. At a first build the service domain is often not decided yet.
  note_later: Nothing is issued. Gateways come up on HTTP, and certificates are added later with the same command that renews them.
  note_rootkey: The offline root's private key is never asked for and has no field. Only the public root is referenced.
  root: Root cert ref
  inter: Intermediate ref
  key: Intermediate key ref
  email: Account email
  provider: DNS provider
  token: API token ref
pkimode:
  none: decide later, gateways on HTTP
  acme: public certificates, needs DNS control
  ca: private CA issues inside the cluster
  byo: the customer supplies a bundle
regmode:
  embedded: RKE2 shares images between nodes
  upstream: pull from the internet directly
  external: "an existing registry, e.g. Harbor"
  internal: served from an air-gap bundle
cap:
  menu: menu
  move: move
  select: choose
  continue: continue
  edit: edit
  nextfield: next field
  done: finish
  activate: activate
  buttons: buttons
  content: back to content
topo:
  server: server
  agent: agent
  lbpool: lb pool
  join: join
  here: this machine
  unresolved: not an address
