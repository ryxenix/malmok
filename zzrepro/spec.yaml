apiVersion: platform.ryxen.dev/v1alpha1
kind: ClusterSpec
metadata:
  name: idc-single
  profile: onprem-dmz
network:
  mode: online
topology:
  registrationAddress: 192.168.88.241
  acceptNodeRegistration: true
  servers:
    - host: 192.168.88.241
      ssh: { user: k8s, password: env://NODE_PASSWORD }
kubernetes:
  version: v1.36.3+rke2r1
  dataplane:
    preset: cilium-gw
pki:
  mode: none
registry:
  mode: embedded
gateway:
  domainSuffix: idc.example
  gateways:
    - name: public
      exposure: node-ips
      routeNamespaces: all
      listeners:
        - name: http
          protocol: HTTP
          port: 80
