key:
  retry: retry
hint:
  password: Used for the checks only; it is never written to cluster.yaml. Leave empty to use a key or an agent
  version: RKE2's stable channel fills this when the network answers; Space flips to the latest release and back. On an air-gapped site, type the version the bundle carries
  registration: A VIP or DNS name. Empty means this server's own address -- allowed where network policy permits no VIP and no DNS, at the cost of re-joining every node if HA comes later
  lbpool: CIDRs the gateway takes its external address from
  noproxy: Include the pod and service CIDRs, or in-cluster traffic goes through the proxy
  registry: Every system image is pulled from here
  sourceref: file://, env:// or sops:// -- a reference, not the value
  rootkey: This is the intermediate key. The root key stays offline
  bundle: The Hauler artifact carried across the gap. Either this or a registry address -- an air-gapped build needs one of the two
  acmeserver: Empty means Let's Encrypt production. Point it at staging while testing -- a mistake against production spends a rate limit that resets in a week
  sudopassword: Only used to elevate on this machine; never written to cluster.yaml. Leave empty if malmok is already running as root
  toggle_steps: steps
  toggle_ascii: ascii
  toggle_lang: 한국어
  select: Up and down to move, Space to choose, Enter to continue
  edit: Up and down to move, Enter to edit, Tab for the buttons
  editing: Typing. Enter or Esc to finish
  install: Continue writes to the nodes
  fix: Fix the problems before installing
  working: Working
  finished: Finished
  close: Enter to close
note:
  options: CNI, gateway and load balancer IP are one atomic choice (ADR-004).
net:
  heading: Network
  help: "Where the nodes sit relative to the internet, and the addressing the network team has to agree to. The profile suggested these; every one of them can be changed here."
  mode: Reachability
  routing: Pod routing
  encrypt: Node-to-node traffic
  encrypt.on: encrypted
  encrypt.on.note: WireGuard between nodes; the default wherever they cross a boundary
  encrypt.off: cleartext
  encrypt.off.note: one segment, nothing in between
  proxyHTTP: HTTP proxy
  proxyHTTPS: HTTPS proxy
  noProxy: No proxy
  lbpool: LB address pool
reg:
  heading: Registry
  help: Where images are pulled from.
  note_none: Nothing to configure. Images come from here without a registry to stand up or keep alive.
  host: Registry host
  user: Username ref
  pass: Password ref
  ca: CA certificate ref
  bundle: Airgap bundle path
  tls: Registry certificate
  tls.verify: verify
  tls.verify.note: the CA above, or a public one, has to vouch for it
  tls.insecure: accept unverified
  tls.insecure.note: recorded in the audit report; a lab shortcut, not a production setting
pki:
  heading: Certificates
  help_mode: Whether to issue certificates now. At a first build the service domain is often not decided yet.
  note_later: Nothing is issued. Gateways come up on HTTP, and certificates are added later with the same command that renews them.
  note_rootkey: The offline root's private key is never asked for and has no field. Only the public root is referenced.
  root: Root cert ref
  inter: Intermediate ref
  key: Intermediate key ref
  email: Account email
  provider: DNS provider
  token: API token ref
  server: ACME server
  byocert: Certificate ref
  byokey: Private key ref
  byoca: Issuing CA ref
  trust: Distribute the CA in-cluster
  trust.bundle: every namespace
  trust.bundle.note: trust-manager syncs the CA everywhere pods can read it
  trust.nodes: nodes only
  trust.nodes.note: pods that need the CA mount it themselves
pkimode:
  none: decide later, gateways on HTTP
  acme_http: public certificates, needs port 80 reachable
  acme_dns: public certificates, needs DNS API access; wildcards
  ca: private CA issues inside the cluster
  byo: the customer supplies a bundle
regmode:
  embedded: RKE2 shares images between nodes
  upstream: pull from the internet directly
  external: "an existing registry, e.g. Harbor"
  internal: served from an air-gap bundle
cap:
  menu: menu
  move: move
  select: choose
  continue: continue
  edit: edit
  nextfield: next field
  done: finish
  activate: activate
  buttons: buttons
  content: back to content
topo:
  server: server
  agent: agent
  lbpool: lb pool
  join: join
  here: this machine
  unresolved: not an address
gw:
  heading: How it is reached
  help: "How traffic from outside reaches the cluster. Nothing is exposed until this says so: an address the network did not assign is the thing an IDC or air-gapped policy refuses."
  exposure: Exposure
  name: Gateway name
  address: Gateway address
  note.none: "Nothing is exposed. A Service of type LoadBalancer will stay Pending, because there is no address to give it -- which is the right answer until somebody says which address this cluster may answer on."
  note.nodeips: "The nodes' own addresses answer on port 80 (and 443 where a certificate exists). No new address appears on the segment, which is what makes this the choice for a site that assigns none. A node that leaves takes its endpoint with it, so point the DNS record at more than one, or put something in front of them."
  note.nodeips_single: "This node's own address answers on port 80 (and 443 where a certificate exists). No new address appears on the segment, which is what makes this the choice for a site that assigns none -- and on a single node it is the only one, since there is nothing to spread traffic over and nothing to fail over to."
  note.pool: "An address is taken from the pool and announced on the segment. Only where the network assigned that range to this cluster: announcing an address somebody else holds is an outage for both."
expose:
  none: nothing is exposed yet
  nodeips: the nodes' own addresses
  pool: an address from the pool
