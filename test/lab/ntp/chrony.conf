# Upstreams for the lab's time source. This machine has a route out; the lab
# nodes, while a case has them cut off, do not.
pool kr.pool.ntp.org iburst maxsources 3
pool time.cloudflare.com iburst maxsources 2

# Serve the lab segment and nothing else.
allow 192.168.88.0/24

# Keep answering if the upstreams go away for a while, at a stratum that tells
# a client this is a local clock and not a reference.
local stratum 10

makestep 1 3
