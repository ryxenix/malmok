# TUI string catalogue. English is the default (ADR-009).
# Diagnostic codes such as PF-204 are identifiers and never appear here.
app:
  title: platformctl installer
step:
  lang: Language
  nodes: Nodes
  profile: Profile
  options: Options
  network: Network
  registry: Registry
  pki: Certificates
  preflight: Checks
  summary: Summary
  install: Install
  done: Finished
lang:
  heading: Language
  help: Choose the language for this installer. It does not change log output, which is always English.
nodes:
  heading: Node details
  help: "Enter the nodes to install on. Separate agents with commas."
  server: Server IP
  agents: Agent IPs
  user: SSH user
  port: SSH port
  registration: Join address
  version: RKE2 version
  domain: Domain
profile:
  heading: Profile
  help: Pick the environment. The profile decides the validated baseline; every other setting is an override.
  homelab: single node, online, local-path
  company: 1+2, online, longhorn
  dmz: 1+2, proxy, private CA
  airgap_ubuntu: 1+2, air-gapped, private CA
  airgap_rocky: Rocky 9, air-gapped, private CA
  airgap_cons: Rocky 9, air-gapped, canal fallback
options:
  heading: Platform options
  help: The dataplane binds CNI, gateway and load balancer IP as one choice; they are not independent.
  dataplane: Dataplane
  storage: Storage
dp:
  cilium_gw: Cilium CNI and gateway, LB-IPAM
  cilium_traefik: Cilium CNI, Traefik gateway
  canal: Canal and Traefik, no eBPF required
st:
  local: single node only
  longhorn: replicated, needs iscsid
  nfs: external server
  server: NFS server
  path: Export path
preflight:
  heading: Preflight checks
summary:
  heading: Summary
  help: Review before anything is changed. Nothing has been written to a node yet.
  warnings: findings from preflight
  valid: The document is valid
  invalid: The document has problems
install:
  heading: Installing
done:
  heading: Finished
  ok: Installation complete
  failed: Installation stopped
  artifacts: Run directory
  resume: Fix the cause and resume with the same run id; completed steps are not repeated.
status:
  pending: waiting
  running: running
  ok: done
  skipped: skipped
  failed: failed
  blocked: blocked
btn:
  next: Continue
  back: Back
  quit: Quit
  abort: Abort
  check: Retry checks
  install: Install
  fix: Go and fix
  logs: Logs
  close: Close
key:
  retry: retry
hint:
  registration: A VIP or DNS name, never a node's own address (ADR-008)
  lbpool: CIDRs the gateway takes its external address from
  noproxy: Include the pod and service CIDRs, or in-cluster traffic goes through the proxy
  registry: Every system image is pulled from here
  sourceref: file://, env:// or sops:// -- a reference, not the value
  rootkey: This is the intermediate key. The root key stays offline
  select: Up and down to move, Enter to choose, Tab for the buttons
  edit: Enter to edit the field, Tab for the buttons
  editing: Typing. Enter or Esc to finish
  install: Continue writes to the nodes
  fix: Fix the problems before installing
  working: Working
  finished: Finished
  close: Enter to close
note:
  profile: The profile fixes the validated baseline; the options screen shows what it chose.
  options: Overrides the profile. CNI, gateway and load balancer IP are one atomic choice (ADR-004).
net:
  heading: Network
  help: Addressing the customer's network team has to agree to. The load balancer pool is what the gateway takes its external address from.
  proxyHTTP: HTTP proxy
  proxyHTTPS: HTTPS proxy
  noProxy: No proxy
  lbpool: LB address pool
reg:
  heading: Registry
  help: Where images are pulled from. Credentials are references, not values.
  host: Registry host
  user: Username ref
  pass: Password ref
  ca: CA certificate ref
pki:
  heading: Certificates
  help_ca: The private CA that issues certificates inside the cluster.
  help_acme: The ACME account that issues public certificates.
  note_rootkey: The offline root's private key is never asked for and has no field. Only the public root is referenced.
  root: Root cert ref
  inter: Intermediate ref
  key: Intermediate key ref
  email: Account email
  provider: DNS provider
  token: API token ref
