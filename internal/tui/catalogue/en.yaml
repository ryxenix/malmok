prefs:
  heading: Settings
  help: "How this screen looks. Space changes the one under the cursor and the choice is kept for next time; g, a and s are the same three toggles from any screen."
  lang: Language
  charset: Character set
  charset.unicode: Unicode
  charset.ascii: ASCII
  rail: Step list
  rail.shown: shown
  rail.hidden: hidden
  where: Kept in
menu:
  heading: Start
  help: "What would you like to do?"
  tagline: RKE2 platforms, staked to the ground
  install: Install a cluster
  install.help: Build a new RKE2 cluster from scratch, or re-run against one this tool already built.
  upgrade: Upgrade
  upgrade.help: Move a cluster to a newer version, one node at a time.
  document: Edit a document
  document.help: Open an existing cluster.yaml and change it without starting a build.
  settings: Settings
  settings.help: Language, character set and the step list. Kept between runs.
  logs: Runs and logs
  logs.help: Look at what a previous run did, including one that failed.
  quit: Quit
  quit.help: Close malmok. Nothing running on a node is stopped.
  unavailable: "  (not built yet)"
  unavailable.status: This is not implemented. Nothing here will change if you choose it.
open:
  heading: Open a document
  help: "Choose the cluster.yaml to edit. It is read as it is, edited on the screens that follow, and written back — fields this wizard has no screen for are kept untouched."
  help.upgrade: "Choose the cluster.yaml that names the cluster to upgrade. It is read, not written: the file describes what the cluster is, and it becomes true when the last node reports the new version."
  path: Path
  path.hint: A path to a cluster.yaml. Choosing one below fills this in.
  found: "Found here"
  none: No document was found in this directory. Type a path above.
  hint: Space chooses one of the files below; Enter edits the path
  err.empty: No path was given, so there is nothing to open.
save:
  heading: Save
  help: "This is what will be written. Everything the screens do not show is carried over from the document as it was read."
  path: Written to
  written: The document has been written.
  after: "Nothing on a cluster has changed. Run `malmok apply -f` against this file to make it so."
  hint: Enter writes the file; Esc goes back to change something
target:
  heading: Target version
  help: "Choose the version to move to. Nothing is touched until the preconditions pass: the control plane moves one minor version at a time, there is no downgrade, and every node has to be Ready before the first one goes down."
  document: Document
  from: Running now
  unknown: not recorded in the document
  version: Move to
  version.hint: "An RKE2 version, e.g. v1.35.7+rke2r1"
  note: "Servers first, then agents, one node at a time. Each node is drained before its kubelet restarts and uncordoned once the cluster agrees it is back."
upgrade:
  heading: Upgrading
doc:
  snapshot: "  (a run's snapshot — editing it means that run can no longer be resumed)"
runs:
  heading: Runs
  help: "Every run this tool recorded, newest first. Opening one replays what happened."
  none: No run has been recorded here yet. A run appears once `malmok apply` has written one.
  count: run(s)
  col_id: run
  col_when: when
  col_summary: what happened
  phases: phases
  failed: failed
  blocked: blocked
where:
  heading: Where to build
  help: "Which machine is this cluster being built on? The first server can be this machine, in which case nothing is connected to and its address is taken from the machine itself."
  here: This machine
  remote: Other machines
  remote.note: entered by address, reached over SSH
  noaddress: This machine has no routable IPv4 address, so there is nothing for the cluster to advertise
nodes:
  heading: Node details
  help: "Enter the nodes to install on. Separate agents with commas."
  help.local: "Enter the nodes to install on. Every address here belongs to this machine, so the work runs here and nothing is connected to."
  server: Server IP
  os: Operating system
  thismachine: This machine
  advertised: the address the rest of the cluster reaches
  agents: Agent IPs
  user: SSH user
  port: SSH port
  password: SSH password
  sudopassword: sudo password
  registration: Join address
  version: RKE2 version
  version.section: RKE2 version
  version.stable: upstream's production judgement
  version.latest: the newest release
  domain: Domain
profile:
  heading: Profile
  help: Pick the environment. The profile decides the validated baseline; every other setting is an override.
  homelab: single node, online, local-path
  company: 1+2, online, longhorn
  dmz: 1+2, proxy, private CA
  airgap_ubuntu: 1+2, air-gapped, private CA
  airgap_rocky: Rocky 9, air-gapped, private CA
  airgap_cons: Rocky 9, air-gapped, canal fallback
options:
  heading: Platform options
  help: The dataplane binds CNI, gateway and load balancer IP as one choice; they are not independent.
  dataplane: Dataplane
  storage: Storage
  downgrade: If a node cannot run it
  fallback: Fall back to
os:
  auto: read from the node itself
  ubuntu: Ubuntu 22.04 or 24.04
  rocky: Rocky Linux 9
routing:
  overlay: VXLAN between nodes; works on any network
  native: routed pod CIDRs; needs the network to carry them
fallback:
  none: do not downgrade at all
netmode:
  online: direct egress to the internet
  proxy: through an HTTP proxy, DMZ
  airgap: no egress at all; images come from a bundle
dgpolicy:
  confirm: stop and say what would change
  auto: take the lesser option and record it
  forbid: refuse to build rather than downgrade
dp:
  cilium_gw: Cilium CNI and gateway, LB-IPAM
  cilium_traefik: Cilium CNI, Traefik gateway
  canal: Canal and Traefik, no eBPF required
st:
  local: single node only
  longhorn: replicated, needs iscsid
  nfs: external server
  server: NFS server
  path: Export path
